<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Dungeon — Side-Scroller (P0)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10131a;
        --panel: #1a2030;
        --ink: #e8ecf6;
        --muted: #a8b3c9;
        --accent: #7fd1b9;
        --danger: #ff9a9a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 24rem;
        gap: 1rem;
        padding: 1rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--accent); }
      p { margin: 0.25rem 0; color: var(--muted); }
      main { min-width: 0; }
      #game {
        width: 100%;
        height: auto;
        border: 1px solid #2b3550;
        border-radius: 0.5rem;
        background: #0b0d13;
      }
      aside {
        background: var(--panel);
        border: 1px solid #2b3550;
        border-radius: 0.5rem;
        padding: 1rem;
        align-self: start;
      }
      dl { display: grid; grid-template-columns: 10rem 1fr; gap: 0.25rem 0.75rem; margin: 0; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      ul { margin: 0; padding-left: 1.25rem; }
      li { margin: 0.15rem 0; }
      button {
        font: inherit;
        color: var(--ink);
        background: #24304a;
        border: 1px solid #3a4a6d;
        border-radius: 0.35rem;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
      }
      button:hover { background: #2d3b59; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
      #error {
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #7a3535;
        border-radius: 0.35rem;
        background: #2a1518;
        color: var(--danger);
      }
      #status { margin-top: 0.75rem; color: var(--accent); min-height: 1.5em; }
      .hint { font-size: 0.85rem; color: var(--muted); }
      @media (max-width: 900px) {
        body { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Knowledge Dungeon — Side-Scroller</h1>
      <p>Phase P0: scaffold, storage, and boot. World rendering starts in P1.</p>
      <canvas id="game" width="960" height="540" aria-label="Game world (not rendered in P0)"></canvas>
    </main>

    <aside aria-labelledby="panel-title">
      <h2 id="panel-title">Pipeline proof</h2>
      <dl id="summary"></dl>

      <h2>Rooms</h2>
      <ul id="rooms"><li class="hint">No active subject.</li></ul>

      <div class="actions">
        <button id="start-tutorial" type="button">Start tutorial</button>
        <button id="clear-save" type="button">Clear saved state</button>
      </div>

      <div id="error" role="alert" hidden></div>
      <div id="status" role="status" aria-live="polite"></div>
      <p class="hint">State persists in IndexedDB under one record. Reload to verify.</p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
